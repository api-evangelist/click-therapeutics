aid: click-therapeutics
name: Click Therapeutics
description: 'Click Therapeutics, Inc. is a New York-headquartered digital medicine company
  founded in 2012 by David Benshoof Klein that develops, validates, and commercializes
  software as prescription medical treatments — the category it named Digital Therapeutics.
  Its AI-enabled platform targets diseases with an underlying neurological or behavioral
  component through cognitive and neurobehavioral mechanisms, delivered as smartphone
  software used independently or alongside biomedical therapy (Software-Enhanced Drugs).
  Authorized and commercial programs include CT-152 (Rejoyn, major depressive disorder,
  developed with Otsuka), CT-132 (episodic migraine) and AspyreRx (type 2 diabetes), with
  a pipeline spanning schizophrenia (CT-155 with Boehringer Ingelheim, CT-156), opioid use
  disorder, multiple sclerosis, atopic dermatitis, obesity, oncology, insomnia and acute
  coronary syndrome. Click publishes no public developer program, API, or SDK — its software
  is distributed as regulated prescription therapeutics, not as a platform.'
